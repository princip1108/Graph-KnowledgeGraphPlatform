<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>登录与注册</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/login-register.css}">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <section class="auth-section py-12 md:py-20 bg-base-200">
        <div class="container mx-auto px-4 max-w-5xl">
            <div class="grid auth-grid gap-8 items-start">
                <div class="space-y-5">
                    <span class="badge badge-primary">认证入口</span>
                    <h1 class="text-4xl font-bold">登录或创建账户</h1>
                    <p class="text-base-content/70 leading-7">
                        这一版先恢复真实可用的认证链路。表单登录走 `/api/auth/login`，注册成功后会自动登录并跳转首页。
                    </p>
                    <div class="bg-base-100 border border-base-300 rounded-box p-5 shadow-soft space-y-3">
                        <div class="font-semibold">当前可用能力</div>
                        <div class="text-sm text-base-content/70">表单登录、邮箱注册、密码重置接口、GitHub OAuth2 登录入口。</div>
                    </div>
                </div>

                <div class="card bg-base-100 border border-base-300">
                    <div class="card-body p-6 md:p-8">
                        <div class="tabs tabs-boxed grid grid-cols-2 mb-6">
                            <button id="loginTab" class="tab tab-active" type="button" onclick="switchTab('login')">登录</button>
                            <button id="registerTab" class="tab" type="button" onclick="switchTab('register')">注册</button>
                        </div>

                        <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
                            <div class="form-control">
                                <label class="label"><span class="label-text">邮箱 / 手机号 / 用户名</span></label>
                                <input id="login-account" type="text" class="input input-bordered w-full" required>
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text">密码</span></label>
                                <input id="login-password" type="password" class="input input-bordered w-full" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-full">登录</button>
                            <div class="divider text-xs text-base-content/50">或</div>
                            <a href="/oauth2/authorization/github" class="btn btn-outline w-full gap-2">
                                <span class="iconify" data-icon="mdi:github" data-width="18"></span>
                                GitHub 登录
                            </a>
                        </form>

                        <form id="registerForm" class="space-y-4 hidden" onsubmit="handleRegister(event)">
                            <div class="form-control">
                                <label class="label"><span class="label-text">用户名</span></label>
                                <input id="reg-username" type="text" class="input input-bordered w-full" required>
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text">邮箱</span></label>
                                <input id="reg-email" type="email" class="input input-bordered w-full" required>
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text">邮箱验证码</span></label>
                                <div class="join">
                                    <input id="reg-verification-code" type="text" class="input input-bordered join-item flex-1" required>
                                    <button id="verifyBtn" class="btn btn-outline join-item" type="button" onclick="sendEmailVerificationCode()">发送验证码</button>
                                </div>
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text">手机号</span></label>
                                <input id="reg-phone" type="tel" class="input input-bordered w-full">
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text">密码</span></label>
                                <input id="reg-password" type="password" class="input input-bordered w-full" required>
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text">确认密码</span></label>
                                <input id="reg-confirm-password" type="password" class="input input-bordered w-full" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-full">创建账户</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <th:block layout:fragment="js">
        <script th:src="@{/js/login-register.js}"></script>
        <script>
            window.sendEmailVerificationCode = async function() {
                const email = document.getElementById('reg-email').value.trim();
                const btn = document.getElementById('verifyBtn');
                if (!email) {
                    window.showNotification('请先输入邮箱', 'warning');
                    return;
                }

                btn.disabled = true;
                btn.textContent = '发送中...';
                try {
                    const response = await fetch('/api/auth/send-code', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email, purpose: 'register' })
                    });
                    const result = await response.json();
                    if (!response.ok) {
                        throw new Error(result.error || '发送失败');
                    }

                    window.showNotification(result.message || '验证码已发送', 'success');
                    let countdown = 60;
                    btn.textContent = countdown + '秒后重发';
                    const timer = setInterval(() => {
                        countdown -= 1;
                        if (countdown <= 0) {
                            clearInterval(timer);
                            btn.disabled = false;
                            btn.textContent = '发送验证码';
                            return;
                        }
                        btn.textContent = countdown + '秒后重发';
                    }, 1000);
                } catch (error) {
                    btn.disabled = false;
                    btn.textContent = '发送验证码';
                    window.showNotification(error.message || '发送失败', 'error');
                }
            };

            const originalRegister = window.handleRegister;
            window.handleRegister = function(event) {
                event.preventDefault();

                const username = document.getElementById('reg-username').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const code = document.getElementById('reg-verification-code').value.trim();
                const phone = document.getElementById('reg-phone').value.trim();
                const password = document.getElementById('reg-password').value;
                const confirmPassword = document.getElementById('reg-confirm-password').value;

                if (!username || !email || !code || !password || !confirmPassword) {
                    window.showNotification('请完整填写注册信息', 'error');
                    return;
                }
                if (password !== confirmPassword) {
                    window.showNotification('两次输入的密码不一致', 'error');
                    return;
                }
                if (password.length < 8) {
                    window.showNotification('密码长度至少8位', 'error');
                    return;
                }

                window.showNotification('正在注册...', 'info');

                fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: new URLSearchParams({
                        userName: username,
                        email: email,
                        verificationCode: code,
                        phone: phone,
                        password: password
                    })
                }).then(async (response) => {
                    const result = await response.json();
                    if (!response.ok) {
                        throw new Error(result.error || '注册失败');
                    }
                    window.showNotification('注册成功', 'success');
                    setTimeout(() => {
                        window.location.href = result.redirect || '/graph/home.html';
                    }, 500);
                }).catch((error) => {
                    window.showNotification(error.message || '注册失败', 'error');
                });
            };
        </script>
    </th:block>
</div>
</body>
</html>
