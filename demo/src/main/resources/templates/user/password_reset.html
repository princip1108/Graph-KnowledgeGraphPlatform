<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>重置密码</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/password-reset.css}">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <section class="container mx-auto px-4 py-12 max-w-xl">
        <a id="back-link" th:href="@{/login}" class="btn btn-ghost btn-sm mb-6">
            <span class="iconify" data-icon="heroicons:arrow-left" data-width="16"></span>
            返回登录
        </a>

        <div class="card bg-base-100 border border-base-300 shadow-soft">
            <div class="card-body">
                <h1 class="text-2xl font-bold">重置密码</h1>
                <ul class="steps w-full my-6">
                    <li id="step-1" class="step step-primary">验证身份</li>
                    <li id="step-2" class="step">设置密码</li>
                    <li id="step-3" class="step">完成</li>
                </ul>

                <div id="verification-step" class="space-y-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text">邮箱</span></label>
                        <div class="join w-full">
                            <input id="contact-input" class="input input-bordered join-item flex-1" type="email" placeholder="name@example.com">
                            <button id="send-code-btn" class="btn btn-primary join-item" type="button" onclick="sendVerificationCode()">获取验证码</button>
                        </div>
                        <div class="error-container mt-1"></div>
                    </div>
                    <div id="resend-timer" class="hidden text-sm text-base-content/60">
                        <span id="countdown">60</span> 秒后可重新发送
                        <button id="resend-link" class="link link-primary hidden" type="button" onclick="sendVerificationCode()">重新发送</button>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">验证码</span></label>
                        <input id="verification-code" class="input input-bordered" maxlength="6" inputmode="numeric" placeholder="6 位验证码">
                        <div class="error-container mt-1"></div>
                    </div>
                    <button class="btn btn-primary w-full" type="button" onclick="verifyCode()">下一步</button>
                </div>

                <div id="password-step" class="hidden space-y-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text">新密码</span></label>
                        <div class="relative">
                            <input id="new-password" class="input input-bordered w-full pr-12" type="password" placeholder="8-20 位，包含字母和数字">
                            <button class="btn btn-ghost btn-sm absolute right-1 top-1" type="button" onclick="togglePasswordVisibility('new-password')">
                                <span class="iconify" data-icon="heroicons:eye" data-width="18"></span>
                            </button>
                        </div>
                        <div class="error-container mt-1"></div>
                    </div>
                    <div class="flex gap-1">
                        <div id="strength-1" class="h-2 flex-1 bg-base-300 rounded"></div>
                        <div id="strength-2" class="h-2 flex-1 bg-base-300 rounded"></div>
                        <div id="strength-3" class="h-2 flex-1 bg-base-300 rounded"></div>
                        <div id="strength-4" class="h-2 flex-1 bg-base-300 rounded"></div>
                    </div>
                    <div id="strength-text" class="text-sm text-base-content/60">请输入密码</div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">确认密码</span></label>
                        <div class="relative">
                            <input id="confirm-password" class="input input-bordered w-full pr-12" type="password" placeholder="再次输入新密码">
                            <button class="btn btn-ghost btn-sm absolute right-1 top-1" type="button" onclick="togglePasswordVisibility('confirm-password')">
                                <span class="iconify" data-icon="heroicons:eye" data-width="18"></span>
                            </button>
                        </div>
                        <div class="error-container mt-1"></div>
                    </div>
                    <button class="btn btn-primary w-full" type="button" onclick="resetPassword()">重置密码</button>
                </div>

                <div id="success-step" class="hidden text-center py-8">
                    <span class="iconify text-success" data-icon="heroicons:check-circle" data-width="72"></span>
                    <h2 class="text-xl font-semibold mt-4">密码已重置</h2>
                    <a th:href="@{/login}" class="btn btn-primary mt-6">返回登录</a>
                </div>
            </div>
        </div>
    </section>

    <th:block layout:fragment="js">
        <script th:src="@{/js/password-reset.js}"></script>
    </th:block>
</div>
</body>
</html>
