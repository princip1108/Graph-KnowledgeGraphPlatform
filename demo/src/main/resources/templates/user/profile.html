<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>个人中心</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/profile.css}">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <section class="container mx-auto px-4 py-8 max-w-7xl">
        <div class="grid profile-layout gap-6">
            <aside class="bg-base-100 border border-base-300 rounded-box p-4 shadow-soft">
                <div class="p-2">
                    <div class="avatar placeholder">
                        <div class="w-16 rounded-full bg-primary text-primary-content">
                            <span id="form-avatar-text">用</span>
                            <img id="form-avatar-img" class="hidden" alt="头像">
                        </div>
                    </div>
                    <input id="avatar-input" class="hidden" type="file" accept="image/*" onchange="handleAvatarUpload(this)">
                    <button class="btn btn-ghost btn-xs mt-3" type="button" onclick="document.getElementById('avatar-input').click()">更换头像</button>
                </div>
                <ul class="menu mt-4">
                    <li><a class="active" data-section="profile" onclick="showSection('profile')">资料</a></li>
                    <li><a id="nav-messages" data-section="messages" onclick="showSection('messages')">消息</a></li>
                    <li><a id="nav-favorites" data-section="favorites" onclick="showSection('favorites')">收藏</a></li>
                    <li><a id="nav-search-history" data-section="search-history" onclick="showSection('search-history')">搜索历史</a></li>
                    <li><a id="nav-browse-history" data-section="browse-history" onclick="showSection('browse-history')">浏览历史</a></li>
                    <li><a id="nav-settings" data-section="settings" onclick="showSection('settings')">设置</a></li>
                </ul>
            </aside>

            <main class="flex-1 p-6 bg-base-100 border border-base-300 rounded-box shadow-soft min-w-0">
                <div class="navbar-center mb-6">
                    <h1 class="text-xl font-bold">个人中心</h1>
                </div>

                <section id="profile-section" class="content-section active">
                    <form id="profile-form" class="grid md:grid-cols-2 gap-4">
                        <div class="form-control">
                            <label class="label"><span class="label-text">用户名</span></label>
                            <input id="form-username" class="input input-bordered" name="userName">
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text">邮箱</span></label>
                            <input id="form-email" class="input input-bordered" name="email" type="email">
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text">手机</span></label>
                            <input id="form-phone" class="input input-bordered" name="phone">
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text">性别</span></label>
                            <select id="form-gender" class="select select-bordered" name="gender">
                                <option value="">未设置</option>
                                <option value="男">男</option>
                                <option value="女">女</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text">生日</span></label>
                            <input id="form-birthday" class="input input-bordered" name="birthday" type="date">
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text">机构</span></label>
                            <input id="form-institution" class="input input-bordered" name="institution">
                        </div>
                        <div class="form-control md:col-span-2">
                            <label class="label"><span class="label-text">简介</span></label>
                            <textarea id="form-bio" class="textarea textarea-bordered" name="bio" rows="4"></textarea>
                        </div>
                        <div class="md:col-span-2">
                            <button class="btn btn-primary" type="submit">保存资料</button>
                        </div>
                    </form>
                </section>

                <section id="messages-section" class="content-section">
                    <h2 class="text-lg font-semibold mb-4">消息</h2>
                    <div id="inbox-container" class="space-y-3"></div>
                </section>

                <section id="favorites-section" class="content-section">
                    <div class="tabs tabs-boxed mb-4">
                        <button id="tab-posts" class="tab tab-active" type="button" onclick="switchFavoriteTab('posts')">帖子</button>
                        <button id="tab-graphs" class="tab" type="button" onclick="switchFavoriteTab('graphs')">图谱</button>
                    </div>
                    <div id="post-favorites-container" class="grid md:grid-cols-2 gap-4"></div>
                    <div id="graph-favorites-container" class="grid md:grid-cols-2 gap-4 hidden"></div>
                </section>

                <section id="search-history-section" class="content-section">
                    <div class="tabs tabs-boxed mb-4">
                        <button id="tab-search-graph" class="tab tab-active" type="button" onclick="switchSearchHistoryTab('graph')">图谱搜索</button>
                        <button id="tab-search-forum" class="tab" type="button" onclick="switchSearchHistoryTab('forum')">论坛搜索</button>
                    </div>
                    <div id="search-history-graph-container" class="space-y-2"></div>
                    <div id="search-history-forum-container" class="space-y-2 hidden"></div>
                    <button class="btn btn-sm btn-outline mt-4" type="button" onclick="clearAllSearchHistory()">清空搜索历史</button>
                </section>

                <section id="browse-history-section" class="content-section">
                    <div class="tabs tabs-boxed mb-4">
                        <button id="tab-browse-graph" class="tab tab-active" type="button" onclick="switchBrowseHistoryTab('graph')">图谱</button>
                        <button id="tab-browse-post" class="tab" type="button" onclick="switchBrowseHistoryTab('post')">帖子</button>
                    </div>
                    <div id="browse-history-graph-container" class="space-y-2"></div>
                    <div id="browse-history-post-container" class="space-y-2 hidden"></div>
                    <button class="btn btn-sm btn-outline mt-4" type="button" onclick="clearAllBrowseHistory()">清空浏览历史</button>
                </section>

                <section id="settings-section" class="content-section">
                    <h2 class="text-lg font-semibold mb-4">账号设置</h2>
                    <div class="grid md:grid-cols-2 gap-4">
                        <input id="cp-old-password" class="input input-bordered" type="password" placeholder="当前密码">
                        <div class="join">
                            <input id="cp-verify-code" class="input input-bordered join-item flex-1" placeholder="邮箱验证码">
                            <button id="cp-send-code-btn" class="btn btn-outline join-item" type="button" onclick="sendChangePasswordCode()">发送</button>
                        </div>
                        <input id="cp-new-password" class="input input-bordered" type="password" placeholder="新密码">
                        <input id="cp-confirm-password" class="input input-bordered" type="password" placeholder="确认新密码">
                    </div>
                    <button class="btn btn-primary mt-4" type="button" onclick="changePassword()">修改密码</button>
                    <div class="divider"></div>
                    <input id="deactivate-password" class="input input-bordered w-full max-w-md" type="password" placeholder="输入密码确认注销">
                    <button class="btn btn-error mt-3" type="button" onclick="showConfirmDialog('确定注销账号吗？', confirmAccountDeletion)">注销账号</button>
                </section>
            </main>
        </div>
    </section>

    <dialog id="chatModal" class="modal">
        <div class="modal-box">
            <h3 id="chatTargetName" class="font-bold text-lg">聊天</h3>
            <div id="chatMessages" class="min-h-40 max-h-80 overflow-y-auto bg-base-200 rounded-box p-3 mt-4"></div>
            <div class="join w-full mt-4">
                <input id="chatInput" class="input input-bordered join-item flex-1" placeholder="输入消息">
                <button class="btn btn-primary join-item" type="button" onclick="sendChatMessage()">发送</button>
            </div>
        </div>
    </dialog>

    <dialog id="confirmModal" class="modal">
        <div class="modal-box">
            <p id="confirmMessage">确认操作？</p>
            <div class="modal-action">
                <button class="btn btn-ghost" type="button" onclick="closeConfirmModal()">取消</button>
                <button class="btn btn-error" type="button" onclick="executeConfirmedAction()">确认</button>
            </div>
        </div>
    </dialog>

    <th:block layout:fragment="js">
        <script th:src="@{/js/profile.js}"></script>
    </th:block>
</div>
</body>
</html>
