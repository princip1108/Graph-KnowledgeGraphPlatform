<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<head>
    <title>关于我们</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/about.css}">
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <main class="min-h-screen">
            <!-- Hero Section -->
            <section class="hero min-h-96 relative about-hero">
                <div class="hero-overlay bg-primary/80"></div>
                <div class="hero-content text-center text-primary-content">
                    <div class="max-w-4xl">
                        <h1 class="mb-8 text-5xl font-bold">关于我们</h1>
                        <p class="mb-8 text-xl">深入了解我们的愿景和旅程</p>
                    </div>
                </div>
            </section>

            <!-- Mission and Vision Section -->
            <section class="py-16 bg-base-100">
                <div class="container mx-auto px-4 max-w-6xl">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                        <div class="space-y-8">
                            <div>
                                <h2 class="text-3xl font-bold text-base-content mb-6">我们的使命</h2>
                                <p class="text-lg text-base-content/80 leading-relaxed">
                                    我们致力于构建最先进的知识图谱平台，让复杂的知识关系变得清晰可见。通过创新的可视化技术和智能分析工具，我们帮助研究者、学者和企业更好地理解和利用知识，推动人类智慧的传承与发展。
                                </p>
                            </div>
                            <div>
                                <h2 class="text-3xl font-bold text-base-content mb-6">未来愿景</h2>
                                <p class="text-lg text-base-content/80 leading-relaxed">
                                    成为全球领先的知识图谱解决方案提供商，构建一个连接所有知识领域的智能生态系统。我们相信，通过技术的力量，可以让知识的获取、理解和应用变得更加高效，为人类社会的进步贡献力量。
                                </p>
                            </div>
                        </div>
                        <div class="flex justify-center">
                            <div class="w-80 h-80 bg-gradient-to-br from-primary/20 to-accent/20 rounded-full flex items-center justify-center">
                                <span class="iconify text-primary" data-icon="heroicons:light-bulb" data-width="120"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>


            <!-- Contact Section -->
            <section class="py-16 bg-base-200">
                <div class="container mx-auto px-4 max-w-6xl">
                    <div class="text-center mb-12">
                        <h2 class="text-3xl font-bold text-base-content mb-4">联系我们</h2>
                        <p class="text-xl text-base-content/70">与我们取得联系或留下您的宝贵意见</p>
                    </div>
                    <div class="flex justify-center">
                        <div class="space-y-8 max-w-md w-full">
                            <div class="flex items-start gap-4">
                                <span class="iconify text-primary" data-icon="heroicons:envelope" data-width="24"></span>
                                <div>
                                    <h3 class="font-semibold text-base-content mb-2">电子邮箱</h3>
                                    <p class="text-base-content/80">gavriloprincip@163.com</p>
                                </div>
                            </div>
                            <div class="flex items-start gap-4">
                                <span class="iconify text-primary" data-icon="heroicons:clock" data-width="24"></span>
                                <div>
                                    <h3 class="font-semibold text-base-content mb-2">工作时间</h3>
                                    <p class="text-base-content/80">周一至周五 9:00-18:00</p>
                                </div>
                            </div>
                            <div class="mt-8">
                                <a th:href="@{/community/feedback.html}" class="btn btn-primary">
                                    <span class="iconify" data-icon="heroicons:chat-bubble-left-right" data-width="20"></span>
                                    提交反馈
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
