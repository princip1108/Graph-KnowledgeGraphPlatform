<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>用户反馈</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/feedback.css}">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <section class="container mx-auto px-4 py-10 max-w-3xl">
        <div class="mb-8">
            <h1 class="text-3xl font-bold">用户反馈</h1>
            <p class="text-base-content/60 mt-2">提交问题、建议或使用体验，我们会尽快处理。</p>
        </div>

        <div class="card bg-base-100 border border-base-300 shadow-soft">
            <div class="card-body">
                <form id="feedbackForm" class="space-y-5">
                    <div class="form-control">
                        <label class="label"><span class="label-text">反馈类型</span></label>
                        <input id="feedbackType" name="feedbackType" type="hidden">
                        <div class="custom-dropdown">
                            <button class="dropdown-trigger input input-bordered w-full justify-between" type="button">
                                <span class="selected-text placeholder">请选择反馈类型</span>
                                <span class="iconify" data-icon="heroicons:chevron-down" data-width="18"></span>
                            </button>
                            <div class="dropdown-menu">
                                <button class="dropdown-item" type="button" data-value="bug">
                                    <span class="iconify item-icon" data-icon="heroicons:bug-ant" data-width="18"></span>
                                    <span>问题反馈</span>
                                </button>
                                <button class="dropdown-item" type="button" data-value="feature">
                                    <span class="iconify item-icon" data-icon="heroicons:light-bulb" data-width="18"></span>
                                    <span>功能建议</span>
                                </button>
                                <button class="dropdown-item" type="button" data-value="other">
                                    <span class="iconify item-icon" data-icon="heroicons:chat-bubble-left-right" data-width="18"></span>
                                    <span>其他</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="form-control">
                        <label class="label"><span class="label-text">标题</span></label>
                        <input name="subject" class="input input-bordered" required placeholder="请简要描述问题">
                    </div>

                    <div class="form-control">
                        <label class="label"><span class="label-text">内容</span></label>
                        <textarea name="content" class="textarea textarea-bordered min-h-36" required placeholder="请描述复现步骤、期望结果或建议内容"></textarea>
                    </div>

                    <div class="form-control">
                        <label class="label"><span class="label-text">联系邮箱</span></label>
                        <input name="email" type="email" class="input input-bordered" required placeholder="name@example.com">
                    </div>

                    <div>
                        <label class="label px-0"><span class="label-text">附件</span></label>
                        <input id="fileInput" type="file" class="hidden" multiple>
                        <div id="fileUploadArea" class="file-upload-area">
                            <span class="iconify text-base-content/40" data-icon="heroicons:arrow-up-tray" data-width="36"></span>
                            <p class="mt-2 text-sm text-base-content/60">点击或拖拽文件到此处</p>
                        </div>
                        <div id="fileList" class="file-list mt-3"></div>
                    </div>

                    <button id="submitBtn" class="btn btn-primary w-full" type="submit">提交反馈</button>
                </form>
            </div>
        </div>
    </section>

    <th:block layout:fragment="js">
        <script th:src="@{/js/feedback.js}"></script>
    </th:block>
</div>
</body>
</html>
