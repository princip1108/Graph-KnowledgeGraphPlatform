<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>社区论坛</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/forum-list.css}">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <section class="bg-base-200 border-b border-base-300">
        <div class="container mx-auto px-4 py-10 max-w-6xl">
            <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-6">
                <div>
                    <h1 class="text-3xl font-bold">社区论坛</h1>
                    <p class="text-base-content/60 mt-2">浏览图谱讨论、经验分享和问题反馈。</p>
                </div>
                <a th:href="@{/community/post_edit.html}" class="btn btn-primary">发布帖子</a>
            </div>
            <div class="grid sm:grid-cols-3 gap-4 mt-8">
                <div class="stat bg-base-100 border border-base-300 rounded-box">
                    <div class="stat-title">帖子</div>
                    <div id="statTotalPosts" class="stat-value text-primary">0</div>
                </div>
                <div class="stat bg-base-100 border border-base-300 rounded-box">
                    <div class="stat-title">评论</div>
                    <div id="statTotalComments" class="stat-value text-secondary">0</div>
                </div>
                <div class="stat bg-base-100 border border-base-300 rounded-box">
                    <div class="stat-title">今日新增</div>
                    <div id="statTodayPosts" class="stat-value text-accent">0</div>
                </div>
            </div>
        </div>
    </section>

    <section class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="flex flex-col lg:flex-row gap-4 mb-6">
            <div class="join flex-1">
                <input id="searchInput" class="input input-bordered join-item flex-1" type="text" placeholder="搜索帖子标题或内容">
                <button class="btn btn-primary join-item" type="button" onclick="performSearch()">搜索</button>
            </div>
            <select id="sortFilter" class="select select-bordered">
                <option value="latest">最新</option>
                <option value="hot">热门</option>
            </select>
            <select id="domainFilter" class="select select-bordered">
                <option value="">全部领域</option>
            </select>
            <button class="btn btn-ghost" type="button" onclick="resetFilters()">重置</button>
        </div>

        <div id="postsList" class="space-y-4"></div>
        <div id="postsLoading" class="text-center py-12">
            <span class="loading loading-spinner loading-lg text-primary"></span>
            <p class="mt-3 text-base-content/60">加载帖子中...</p>
        </div>
        <div id="postsEmpty" class="hidden text-center py-16 text-base-content/60">
            <span class="iconify text-base-content/30" data-icon="heroicons:document-text" data-width="56"></span>
            <p class="mt-4">暂无帖子</p>
        </div>
        <div id="loadMoreSection" class="hidden text-center mt-8">
            <button class="btn btn-outline" type="button" onclick="loadMorePosts()">加载更多</button>
        </div>
    </section>

    <dialog id="quickCommentModal" class="modal">
        <div class="modal-box">
            <h3 class="font-bold text-lg">快速评论</h3>
            <textarea id="quickCommentContent" class="textarea textarea-bordered w-full mt-4" rows="4" maxlength="500" placeholder="写下你的评论"></textarea>
            <div class="text-right text-xs text-base-content/50 mt-1"><span id="quickCommentCharCount">0</span>/500</div>
            <div class="modal-action">
                <button class="btn btn-ghost" type="button" onclick="closeQuickCommentModal()">取消</button>
                <button class="btn btn-primary" type="button" onclick="submitQuickComment()">发布</button>
            </div>
        </div>
    </dialog>

    <dialog id="shareModal" class="modal">
        <div class="modal-box">
            <h3 class="font-bold text-lg">分享帖子</h3>
            <div class="join w-full mt-4">
                <input id="shareLink" class="input input-bordered join-item flex-1" readonly>
                <button id="copyButton" class="btn btn-primary join-item" type="button" onclick="copyShareLink()">复制</button>
            </div>
            <div class="modal-action">
                <button class="btn btn-ghost" type="button" onclick="closeShareModal()">关闭</button>
            </div>
        </div>
    </dialog>

    <dialog id="privateMessageModal" class="modal">
        <div class="modal-box">
            <h3 class="font-bold text-lg">发送私信</h3>
            <input id="recipientName" class="input input-bordered w-full mt-4" readonly>
            <textarea id="messageContent" class="textarea textarea-bordered w-full mt-3" maxlength="500" rows="4" placeholder="消息内容"></textarea>
            <div class="text-right text-xs text-base-content/50 mt-1"><span id="charCount">0</span>/500</div>
            <div class="modal-action">
                <button class="btn btn-ghost" type="button" onclick="closePrivateMessageModal()">取消</button>
                <button class="btn btn-primary" type="button" onclick="sendPrivateMessage()">发送</button>
            </div>
        </div>
    </dialog>

    <th:block layout:fragment="js">
        <script th:src="@{/js/forum-list.js}"></script>
    </th:block>
</div>
</body>
</html>
