<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>帖子详情</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/post-detail.css}">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <section class="bg-base-200 border-b border-base-300">
        <div class="container mx-auto px-4 py-6 max-w-7xl">
            <div class="flex items-center justify-between gap-4">
                <a th:href="@{/community/forum_list.html}" class="btn btn-ghost btn-sm">
                    <span class="iconify" data-icon="heroicons:arrow-left" data-width="16"></span>
                    返回论坛
                </a>
                <h1 id="headerTitle" class="text-lg font-semibold truncate">帖子详情</h1>
                <div class="flex gap-2">
                    <button id="editBtn" class="btn btn-ghost btn-sm hidden" type="button" onclick="editPost()">编辑</button>
                    <button id="deleteBtn" class="btn btn-ghost btn-sm text-error hidden" type="button" onclick="deletePost()">删除</button>
                </div>
            </div>
        </div>
    </section>

    <section class="container mx-auto px-4 py-8 max-w-7xl">
        <div id="postLoading" class="text-center py-20">
            <span class="loading loading-spinner loading-lg text-primary"></span>
            <p class="mt-3 text-base-content/60">加载帖子中...</p>
        </div>

        <div id="postContent" class="hidden grid post-detail-layout gap-8">
            <main id="mainContent" class="min-w-0 space-y-6">
                <article class="bg-base-100 border border-base-300 rounded-box p-6 shadow-soft">
                    <div class="flex flex-wrap items-center gap-2 mb-4">
                        <span id="postCategory" class="badge badge-primary badge-outline">未分类</span>
                        <span id="postTime" class="text-sm text-base-content/50"></span>
                    </div>
                    <h1 id="postTitle" class="text-3xl font-bold leading-tight">帖子标题</h1>
                    <div id="postTags" class="flex flex-wrap gap-2 mt-4"></div>
                    <div class="flex flex-wrap items-center gap-4 mt-5 text-sm text-base-content/60">
                        <span><span id="postViewCount">0</span> 浏览</span>
                        <span><span id="commentCount">0</span> 评论</span>
                        <span><span id="likeCount">0</span> 点赞</span>
                    </div>
                    <div id="postBody" class="prose max-w-none mt-8"></div>
                    <div class="flex flex-wrap gap-2 mt-8">
                        <button id="likeBtn" class="btn btn-outline btn-sm" type="button" onclick="toggleLike()">
                            <span class="iconify" data-icon="heroicons:heart" data-width="16"></span>
                            点赞
                        </button>
                        <button class="btn btn-outline btn-sm" type="button" onclick="toggleFavorite()">
                            <span id="favoriteIcon" class="iconify" data-icon="heroicons:bookmark" data-width="16"></span>
                            收藏
                        </button>
                        <button class="btn btn-outline btn-sm" type="button" onclick="sharePost()">分享</button>
                        <button id="pinBtn" class="btn btn-outline btn-sm hidden" type="button" onclick="togglePin()">
                            <span id="pinIcon" class="iconify" data-icon="heroicons:bookmark-square" data-width="16"></span>
                            置顶
                        </button>
                        <button id="unpublishBtn" class="btn btn-outline btn-sm hidden" type="button" onclick="unpublishPost()">下架</button>
                    </div>
                </article>

                <section id="commentsSection" class="bg-base-100 border border-base-300 rounded-box p-6 shadow-soft">
                    <div class="flex items-center justify-between">
                        <h2 class="text-xl font-semibold">评论 <span id="totalComments">0</span></h2>
                        <button class="btn btn-ghost btn-sm" type="button" onclick="scrollToComments()">定位评论</button>
                    </div>
                    <div id="commentInputArea" class="mt-5">
                        <div class="flex gap-3">
                            <div id="currentUserAvatar" class="w-10 h-10 rounded-full bg-primary text-primary-content flex items-center justify-center">我</div>
                            <div class="flex-1">
                                <div id="replyingTo" class="hidden text-sm text-base-content/60 mb-2">
                                    回复 <span id="replyingToName"></span>
                                    <button class="link link-primary ml-2" type="button" onclick="cancelReply()">取消</button>
                                </div>
                                <textarea id="commentText" class="textarea textarea-bordered w-full" rows="3" placeholder="写下你的想法..."></textarea>
                                <div class="text-right mt-2">
                                    <button class="btn btn-primary btn-sm" type="button" onclick="submitComment()">发布评论</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="loginPrompt" class="hidden mt-5 text-center text-base-content/60">
                        <a th:href="@{/login}" class="link link-primary">登录后参与评论</a>
                    </div>
                    <div id="commentsList" class="space-y-4 mt-6"></div>
                </section>
            </main>

            <aside class="space-y-6">
                <div class="bg-base-100 border border-base-300 rounded-box p-5 shadow-soft">
                    <div class="flex items-center gap-3">
                        <a id="authorLink" href="#">
                            <div id="authorAvatar" class="w-12 h-12 rounded-full bg-primary text-primary-content flex items-center justify-center">作</div>
                        </a>
                        <div>
                            <a id="sidebarAuthorLink" href="#" class="font-semibold">
                                <span id="authorName">作者</span>
                            </a>
                            <div id="sidebarAuthorName" class="text-sm text-base-content/60">作者</div>
                        </div>
                    </div>
                    <div id="sidebarAuthorAvatar" class="hidden"></div>
                    <div class="flex gap-2 mt-4">
                        <button id="followBtn" class="btn btn-outline btn-sm flex-1" type="button" onclick="toggleFollow()">关注</button>
                        <button id="messageBtn" class="btn btn-outline btn-sm flex-1" type="button" onclick="sendPrivateMessage()">私信</button>
                    </div>
                </div>

                <div id="relatedGraphCard" class="bg-base-100 border border-base-300 rounded-box p-5 shadow-soft hidden">
                    <h3 class="font-semibold mb-2">关联图谱</h3>
                    <a id="relatedGraphLink" href="#" class="link link-primary">
                        <span id="relatedGraphName">图谱</span>
                    </a>
                </div>

                <div class="bg-base-100 border border-base-300 rounded-box p-5 shadow-soft">
                    <h3 class="font-semibold mb-3">统计</h3>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div><div id="statLikes" class="font-bold">0</div><div class="text-xs text-base-content/50">点赞</div></div>
                        <div><div id="statComments" class="font-bold">0</div><div class="text-xs text-base-content/50">评论</div></div>
                        <div><div id="statViews" class="font-bold">0</div><div class="text-xs text-base-content/50">浏览</div></div>
                    </div>
                </div>

                <div class="bg-base-100 border border-base-300 rounded-box p-5 shadow-soft">
                    <h3 class="font-semibold mb-3">目录</h3>
                    <div id="toc" class="space-y-1 text-sm"></div>
                </div>
            </aside>
        </div>
    </section>

    <div id="toast" class="toast toast-top toast-end hidden">
        <div class="alert">
            <span id="toastMessage"></span>
        </div>
    </div>

    <th:block layout:fragment="js">
        <script th:src="@{/js/post-detail.js}"></script>
    </th:block>
</div>
</body>
</html>
