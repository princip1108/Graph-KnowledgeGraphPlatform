<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>管理中心</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <section class="bg-base-200 border-b border-base-300">
        <div class="container mx-auto px-4 py-8 max-w-7xl">
            <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4">
                <div>
                    <h1 class="text-3xl font-bold">管理中心</h1>
                    <p class="text-base-content/60 mt-2">管理自己的图谱、帖子和批量操作。</p>
                </div>
                <div id="admin-section" class="hidden">
                    <a th:href="@{/api/admin/users}" class="btn btn-outline btn-sm">系统管理 API</a>
                </div>
            </div>
        </div>
    </section>

    <section class="container mx-auto px-4 py-8 max-w-7xl">
        <div class="grid dashboard-grid gap-6">
            <aside class="dashboard-nav bg-base-100 border border-base-300 rounded-box p-3 shadow-soft">
                <button class="nav-item active" data-section="graph-batch" type="button" onclick="showSection('graph-batch')">
                    <span class="iconify" data-icon="heroicons:squares-2x2" data-width="18"></span>
                    图谱管理
                </button>
                <button class="nav-item" data-section="post-batch" type="button" onclick="showSection('post-batch')">
                    <span class="iconify" data-icon="heroicons:document-text" data-width="18"></span>
                    帖子管理
                </button>
            </aside>

            <main class="space-y-6 min-w-0">
                <section id="graph-batch-section" class="content-section active">
                    <div class="bg-base-100 border border-base-300 rounded-box shadow-soft">
                        <div class="p-4 border-b border-base-300 flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
                            <div>
                                <h2 class="text-xl font-semibold">图谱管理</h2>
                                <p id="paginationInfo" class="text-sm text-base-content/60 mt-1">加载中...</p>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <div class="join">
                                    <input id="searchInput" class="input input-bordered input-sm join-item" type="text" placeholder="搜索图谱名称">
                                    <button class="btn btn-primary btn-sm join-item" type="button" onclick="performSearch()">搜索</button>
                                </div>
                                <select class="select select-bordered select-sm" onchange="filterByStatus(this.value)">
                                    <option value="all">全部状态</option>
                                    <option value="PUBLISHED">已上线</option>
                                    <option value="DRAFT">草稿</option>
                                    <option value="PRIVATE">私有</option>
                                </select>
                                <select id="graphDomainFilter" class="select select-bordered select-sm" onchange="filterGraphDomain()">
                                    <option value="all">全部领域</option>
                                </select>
                                <button class="btn btn-sm btn-outline" type="button" onclick="openUploadModal()">上传图谱</button>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="table table-zebra">
                                <thead>
                                <tr>
                                    <th><input id="selectAll" type="checkbox" class="checkbox checkbox-primary" onchange="toggleSelectAll(this)"></th>
                                    <th>图谱</th>
                                    <th>状态</th>
                                    <th>上传时间</th>
                                    <th>更新时间</th>
                                    <th>操作</th>
                                </tr>
                                </thead>
                                <tbody id="graphTableBody">
                                <tr><td colspan="6" class="text-center py-8 text-base-content/60">加载中...</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="p-4 border-t border-base-300 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                            <div class="flex flex-wrap gap-2">
                                <button class="btn btn-sm btn-success" type="button" onclick="handleBatchOperation('online')">批量上线</button>
                                <button class="btn btn-sm btn-warning" type="button" onclick="handleBatchOperation('offline')">批量下线</button>
                                <button class="btn btn-sm btn-error" type="button" onclick="handleBatchOperation('delete')">批量删除</button>
                            </div>
                            <div id="paginationButtons" class="join"></div>
                        </div>
                    </div>
                </section>

                <section id="post-batch-section" class="content-section">
                    <div class="bg-base-100 border border-base-300 rounded-box shadow-soft">
                        <div class="p-4 border-b border-base-300 flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
                            <div>
                                <h2 class="text-xl font-semibold">帖子管理</h2>
                                <p id="postPaginationInfo" class="text-sm text-base-content/60 mt-1">加载中...</p>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <div class="join">
                                    <input id="postSearchInput" class="input input-bordered input-sm join-item" type="text" placeholder="搜索帖子标题">
                                    <button class="btn btn-primary btn-sm join-item" type="button" onclick="performPostSearch()">搜索</button>
                                </div>
                                <select class="select select-bordered select-sm" onchange="filterPostsByStatus(this.value)">
                                    <option value="all">全部状态</option>
                                    <option value="已发布">已发布</option>
                                    <option value="草稿">草稿</option>
                                    <option value="已下架">已下架</option>
                                </select>
                                <button class="btn btn-sm btn-outline" type="button" onclick="goToCreatePost()">发帖</button>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="table table-zebra">
                                <thead>
                                <tr>
                                    <th><input id="postSelectAll" type="checkbox" class="checkbox checkbox-primary" onchange="togglePostSelectAll(this)"></th>
                                    <th>帖子</th>
                                    <th>状态</th>
                                    <th>发布时间</th>
                                    <th>点赞</th>
                                    <th>操作</th>
                                </tr>
                                </thead>
                                <tbody id="postTableBody">
                                <tr><td colspan="6" class="text-center py-8 text-base-content/60">加载中...</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="p-4 border-t border-base-300 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                            <div class="flex flex-wrap gap-2">
                                <button class="btn btn-sm btn-success" type="button" onclick="handlePostBatchOnline()">批量上线</button>
                                <button class="btn btn-sm btn-warning" type="button" onclick="handlePostBatchOffline()">批量下线</button>
                                <button class="btn btn-sm btn-error" type="button" onclick="handlePostBatchDelete()">批量删除</button>
                            </div>
                            <div id="postPaginationButtons" class="join"></div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </section>

    <dialog id="editModal" class="modal">
        <div class="modal-box">
            <h3 class="font-bold text-lg">编辑图谱</h3>
            <input id="editGraphId" type="hidden">
            <div class="space-y-3 mt-4">
                <input id="editGraphName" class="input input-bordered w-full" placeholder="图谱名称">
                <textarea id="editGraphDescription" class="textarea textarea-bordered w-full" placeholder="图谱描述"></textarea>
                <select id="editGraphStatus" class="select select-bordered w-full">
                    <option value="DRAFT">草稿</option>
                    <option value="PUBLISHED">已上线</option>
                    <option value="PRIVATE">私有</option>
                </select>
            </div>
            <div class="modal-action">
                <button class="btn btn-ghost" type="button" onclick="closeEditModal()">取消</button>
                <button class="btn btn-primary" type="button" onclick="submitEditForm()">保存</button>
            </div>
        </div>
    </dialog>

    <dialog id="uploadModal" class="modal">
        <div class="modal-box">
            <h3 class="font-bold text-lg">上传图谱</h3>
            <form id="uploadForm" class="space-y-3 mt-4">
                <input id="graphFile" type="file" class="file-input file-input-bordered w-full" accept=".json,application/json">
                <input id="graphName" class="input input-bordered w-full" placeholder="图谱名称">
                <textarea id="graphDescription" class="textarea textarea-bordered w-full" placeholder="图谱描述"></textarea>
                <select id="graphDomain" class="select select-bordered w-full">
                    <option value="other">其他领域</option>
                </select>
                <select id="graphStatus" class="select select-bordered w-full">
                    <option value="DRAFT">草稿</option>
                    <option value="PUBLISHED">已上线</option>
                </select>
                <input id="graphCover" type="file" class="file-input file-input-bordered w-full" accept="image/*" onchange="previewCover(this)">
                <div id="coverPreview" class="hidden">
                    <img id="coverPreviewImg" class="rounded-box border border-base-300 max-h-40 object-cover" alt="封面预览">
                </div>
            </form>
            <div class="modal-action">
                <button class="btn btn-ghost" type="button" onclick="closeUploadModal()">取消</button>
                <button class="btn btn-primary" type="button" onclick="submitUploadForm()">上传</button>
            </div>
        </div>
    </dialog>

    <dialog id="editPostModal" class="modal">
        <div class="modal-box">
            <h3 class="font-bold text-lg">编辑帖子</h3>
            <input id="editPostId" type="hidden">
            <input id="editPostContent" type="hidden">
            <div class="space-y-3 mt-4">
                <input id="editPostTitle" class="input input-bordered w-full" placeholder="帖子标题">
                <textarea id="editPostAbstract" class="textarea textarea-bordered w-full" placeholder="帖子摘要"></textarea>
                <select id="editPostStatus" class="select select-bordered w-full">
                    <option value="草稿">草稿</option>
                    <option value="已发布">已发布</option>
                    <option value="已下架">已下架</option>
                </select>
            </div>
            <div class="modal-action">
                <button class="btn btn-ghost" type="button" onclick="closeEditPostModal()">取消</button>
                <button class="btn btn-primary" type="button" onclick="submitEditPost()">保存</button>
            </div>
        </div>
    </dialog>

    <th:block layout:fragment="js">
        <script th:src="@{/js/dashboard.js}"></script>
    </th:block>
</div>
</body>
</html>
