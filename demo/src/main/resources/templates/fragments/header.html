<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Header Fragment</title>
</head>
<body>
<th:block th:fragment="header">
    <header class="navbar bg-base-100 border-b border-base-300 px-4 md:px-6 sticky top-0 z-40">
        <div class="navbar-start gap-2">
            <a th:href="@{/graph/home.html}" class="btn btn-ghost px-2 text-lg font-semibold">
                GraphWisdom
            </a>
            <nav class="hidden md:flex items-center gap-1 text-sm">
                <a th:href="@{/graph/home.html}" class="btn btn-ghost btn-sm">首页</a>
                <a th:href="@{/graph/graph_list.html}" class="btn btn-ghost btn-sm">图谱</a>
                <a th:href="@{/community/forum_list.html}" class="btn btn-ghost btn-sm">社区</a>
                <a th:href="@{/documentation}" class="btn btn-ghost btn-sm">文档</a>
            </nav>
        </div>
        <div class="navbar-center hidden lg:flex">
            <span class="text-sm text-base-content/60">知识图谱平台运行骨架</span>
        </div>
        <div class="navbar-end gap-2">
            <a th:href="@{/user/profile}" class="btn btn-ghost btn-sm">个人中心</a>
            <a th:href="@{/login}" class="btn btn-primary btn-sm">登录</a>
        </div>
    </header>
</th:block>
</body>
</html>
