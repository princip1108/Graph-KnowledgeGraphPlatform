<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Common Scripts Fragment</title>
</head>
<body>
<th:block th:fragment="scripts">
    <script>
        window.APP_GLOBALS = window.APP_GLOBALS || {};
        window.APP_GLOBALS.user = window.APP_GLOBALS.user || { isLoggedIn: false };
        window.APP_GLOBALS.search = window.APP_GLOBALS.search || {
            history: [],
            recommendations: ['知识图谱', '人工智能', '医学知识', '金融风控', '教育数据'],
            getSearchSuggestions() {
                return [...this.history, ...this.recommendations].filter((item, index, arr) => arr.indexOf(item) === index);
            },
            performSearch(query) {
                if (!query) {
                    return;
                }
                this.history = [query, ...this.history.filter((item) => item !== query)].slice(0, 8);
                window.location.href = '/graph/graph_list.html?keyword=' + encodeURIComponent(query);
            }
        };
        window.APP_GLOBALS.favorites = window.APP_GLOBALS.favorites || {
            load() {
                try {
                    return JSON.parse(localStorage.getItem('favorites') || '[]');
                } catch (error) {
                    return [];
                }
            },
            save(items) {
                localStorage.setItem('favorites', JSON.stringify(items));
            },
            isFavorited(graphId) {
                return this.load().some((item) => String(item.id) === String(graphId));
            },
            add(graphId, graph) {
                const items = this.load();
                if (!this.isFavorited(graphId)) {
                    items.push({ id: String(graphId), name: graph?.name || '未命名图谱', addedAt: new Date().toISOString() });
                    this.save(items);
                }
            },
            remove(graphId) {
                this.save(this.load().filter((item) => String(item.id) !== String(graphId)));
            }
        };

        window.showNotification = function(message, type) {
            const toast = document.getElementById('globalToast');
            const content = document.getElementById('globalToastMessage');
            if (!toast || !content) {
                console.log('[' + (type || 'info') + ']', message);
                return;
            }

            const tone = type || 'info';
            const alertClass = tone === 'error'
                ? 'alert-error'
                : tone === 'success'
                    ? 'alert-success'
                    : tone === 'warning'
                        ? 'alert-warning'
                        : 'alert-info';

            content.textContent = message;
            toast.className = 'toast toast-top toast-end z-50';
            const alert = toast.querySelector('.alert');
            alert.className = 'alert shadow-soft ' + alertClass;
            toast.classList.remove('hidden');

            clearTimeout(window.__globalToastTimer);
            window.__globalToastTimer = setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        };
    </script>
    <script th:src="@{/js/guest-utils.js}"></script>
    <div id="globalToast" class="toast toast-top toast-end z-50 hidden">
        <div class="alert alert-info shadow-soft">
            <span id="globalToastMessage"></span>
        </div>
    </div>
</th:block>
</body>
</html>
