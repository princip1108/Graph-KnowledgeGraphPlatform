<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>图谱详情</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/graph-detail.css}">
    </th:block>
</head>
<body>
<div layout:fragment="content" class="bg-base-200">
    <section class="border-b border-base-300 bg-base-100">
        <div class="container mx-auto px-4 py-4 max-w-7xl">
            <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
                <div class="min-w-0">
                    <div class="flex flex-wrap items-center gap-2">
                        <h1 id="graphTitle" class="text-2xl font-bold truncate">图谱详情</h1>
                        <span id="graphDomainSection" class="badge badge-primary badge-outline hidden">
                            <span id="graphDomain">未分类</span>
                        </span>
                    </div>
                    <p id="graphDescription" class="text-sm text-base-content/60 mt-1 line-clamp-2">正在加载图谱信息...</p>
                    <div id="graphTags" class="flex flex-wrap gap-2 mt-2"></div>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button id="favoriteBtn" class="btn btn-outline btn-sm" type="button" onclick="toggleFavorite()">
                        <span class="iconify" data-icon="heroicons:heart" data-width="16"></span>
                        收藏
                    </button>
                    <button class="btn btn-outline btn-sm" type="button" onclick="shareGraph()">
                        <span class="iconify" data-icon="heroicons:share" data-width="16"></span>
                        分享
                    </button>
                    <button class="btn btn-outline btn-sm" type="button" onclick="downloadGraph()">
                        <span class="iconify" data-icon="heroicons:arrow-down-tray" data-width="16"></span>
                        下载
                    </button>
                    <button class="btn btn-primary btn-sm" type="button" onclick="createPostForGraph()">
                        <span class="iconify" data-icon="heroicons:pencil-square" data-width="16"></span>
                        发帖
                    </button>
                </div>
            </div>
        </div>
    </section>

    <section class="container mx-auto px-4 py-4 max-w-7xl">
        <div class="flex min-h-[72vh] bg-base-100 border border-base-300 rounded-box overflow-hidden shadow-soft">
            <aside id="leftSidebar" class="bg-base-100 border-r border-base-300">
                <button id="leftSidebarToggle" class="sidebar-toggle" type="button">
                    <span id="leftToggleIcon" class="iconify" data-icon="heroicons:chevron-left" data-width="16"></span>
                </button>
                <div id="leftResizeHandle" class="resize-handle resize-handle-left"></div>
                <div class="sidebar-content h-full overflow-y-auto p-4 space-y-5">
                    <div>
                        <div class="join w-full">
                            <select id="searchTargetSelect" class="select select-bordered select-sm join-item" onchange="updateSearchPlaceholder()">
                                <option value="node">节点</option>
                                <option value="relation">关系</option>
                            </select>
                            <input id="graphSearchInput" class="input input-bordered input-sm join-item flex-1" type="text" placeholder="搜索节点名称...">
                            <button class="btn btn-primary btn-sm join-item" type="button" onclick="searchInGraph()">
                                <span class="iconify" data-icon="heroicons:magnifying-glass" data-width="16"></span>
                            </button>
                        </div>
                        <select id="searchTypeFilter" class="select select-bordered select-sm w-full mt-2">
                            <option value="">全部类型</option>
                        </select>
                        <div id="searchResultsPanel" class="hidden mt-3 rounded border border-base-300 bg-base-200 p-3">
                            <div class="text-xs text-base-content/60 mb-2">结果 <span id="searchResultCount">0</span></div>
                            <div id="searchResultList" class="space-y-1 max-h-48 overflow-y-auto"></div>
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between">
                            <h2 class="font-semibold">统计</h2>
                            <button class="btn btn-ghost btn-xs" type="button" onclick="toggleStatistics()">
                                <span id="statsToggleIcon" class="iconify" data-icon="heroicons:chevron-up" data-width="16"></span>
                            </button>
                        </div>
                        <div id="statisticsContent" class="grid grid-cols-2 gap-2 mt-3">
                            <div class="stat p-3"><div class="stat-title text-xs">节点</div><div class="stat-value text-lg">0</div></div>
                            <div class="stat p-3"><div class="stat-title text-xs">关系</div><div class="stat-value text-lg">0</div></div>
                            <div class="stat p-3"><div class="stat-title text-xs">平均度</div><div class="stat-value text-lg">0</div></div>
                            <div class="stat p-3"><div class="stat-title text-xs">密度</div><div class="stat-value text-lg">0</div></div>
                        </div>
                    </div>

                    <div>
                        <h2 class="font-semibold mb-2">节点类型</h2>
                        <div id="entityTypeFilters" class="space-y-1 text-sm text-base-content/60">正在加载...</div>
                    </div>
                    <div>
                        <h2 class="font-semibold mb-2">关系类型</h2>
                        <div id="relationTypeFilters" class="space-y-1 text-sm text-base-content/60">正在加载...</div>
                    </div>

                    <div id="nodeManagementSection" class="hidden pt-3 border-t border-base-300 space-y-2">
                        <button class="btn btn-outline btn-sm w-full" type="button" onclick="openBatchImportModal()">导入节点</button>
                        <button class="btn btn-outline btn-sm w-full" type="button" onclick="openBatchDeleteModal()">删除节点</button>
                        <button class="btn btn-outline btn-sm w-full" type="button" onclick="openAddRelationModal()">添加关系</button>
                        <button class="btn btn-outline btn-sm w-full" type="button" onclick="openDeleteRelationModal()">删除关系</button>
                    </div>
                </div>
            </aside>

            <main id="graphVisualizationArea" class="flex-1 relative bg-base-100">
                <div class="absolute left-3 top-3 z-10 flex gap-2">
                    <button class="btn btn-sm btn-circle" type="button" onclick="zoomIn()" title="放大">+</button>
                    <button class="btn btn-sm btn-circle" type="button" onclick="zoomOut()" title="缩小">-</button>
                    <button class="btn btn-sm" type="button" onclick="resetView()">重置</button>
                </div>
                <div id="graphCanvas" class="w-full h-full min-h-[72vh] relative overflow-hidden"></div>
            </main>

            <aside id="rightSidebar" class="bg-base-100 border-l border-base-300">
                <button id="rightSidebarToggle" class="sidebar-toggle" type="button">
                    <span id="rightToggleIcon" class="iconify" data-icon="heroicons:chevron-right" data-width="16"></span>
                </button>
                <div id="rightResizeHandle" class="resize-handle resize-handle-right"></div>
                <div class="sidebar-content h-full overflow-y-auto p-4 space-y-5">
                    <div>
                        <h2 class="font-semibold mb-3">节点详情</h2>
                        <div id="nodeDetailContent" class="text-sm text-base-content/60">
                            点击节点查看详情
                        </div>
                    </div>

                    <div>
                        <div class="dropdown dropdown-end w-full">
                            <label tabindex="0" class="btn btn-outline btn-sm w-full justify-between">
                                <span id="selectedChartType">节点类型分布饼状图</span>
                                <span class="iconify" data-icon="heroicons:chevron-down" data-width="16"></span>
                            </label>
                            <ul tabindex="0" class="dropdown-content menu p-2 shadow bg-base-100 rounded-box w-56 z-20">
                                <li><a onclick="selectChart('nodeTypePie')">节点类型分布</a></li>
                                <li><a onclick="selectChart('relationTypePie')">关系类型分布</a></li>
                                <li><a onclick="selectChart('coreNodes')">核心节点</a></li>
                                <li><a onclick="selectChart('stats')">基础统计</a></li>
                                <li><a onclick="selectChart('thumbnail')">缩略图</a></li>
                            </ul>
                        </div>
                        <div id="chartContainer" class="h-64 bg-base-200 rounded mt-3 flex items-center justify-center text-sm text-base-content/60">
                            正在加载图表...
                        </div>
                    </div>

                    <div>
                        <h2 class="font-semibold mb-3">上传者</h2>
                        <a id="uploaderLink" href="#" class="flex items-center gap-3">
                            <div id="uploaderAvatar" class="w-10 h-10 rounded-full bg-primary text-primary-content flex items-center justify-center">U</div>
                            <span id="uploaderName" class="font-medium">未知用户</span>
                        </a>
                        <button id="graphMessageBtn" class="btn btn-outline btn-sm w-full mt-3 hidden" type="button" onclick="sendGraphPrivateMessage()">私信</button>
                    </div>
                </div>
            </aside>
        </div>
    </section>

    <section class="container mx-auto px-4 pb-8 max-w-7xl">
        <h2 class="text-lg font-semibold mb-3">相关帖子</h2>
        <div id="relatedPostsContainer" class="grid md:grid-cols-2 lg:grid-cols-4 gap-3"></div>
    </section>

    <dialog id="sendMessageModal" class="modal">
        <div class="modal-box">
            <h3 class="font-bold text-lg">发送私信</h3>
            <input id="msgRecipientId" type="hidden">
            <input id="msgRecipientName" class="input input-bordered w-full mt-4" readonly>
            <textarea id="msgContent" class="textarea textarea-bordered w-full mt-3" rows="4" placeholder="输入消息内容"></textarea>
            <div class="modal-action">
                <form method="dialog"><button class="btn btn-ghost">取消</button></form>
                <button class="btn btn-primary" type="button" onclick="executeSendMessage()">发送</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <th:block th:replace="~{fragments/graph-modals :: modals}"></th:block>
</div>

<th:block layout:fragment="js">
    <script>
        window.navigateTo = window.navigateTo || function(page) {
            var routes = {
                graph_list_page: '/graph/graph_list.html',
                user_profile_page: '/user/profile.html'
            };
            window.location.href = routes[page] || '/';
        };
    </script>
    <script th:src="@{/js/graph/graph-bindao.js}"></script>
    <script th:src="@{/js/graph/graph-bindao-bindao.js}"></script>
    <script th:src="@{/js/graph-detail-page.js}"></script>
</th:block>
</body>
</html>
