<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>图谱列表</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/graph-list.css}">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <section class="bg-base-200 border-b border-base-300">
        <div class="container mx-auto px-4 py-10 max-w-6xl">
            <div class="space-y-6">
                <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-6">
                    <div>
                        <h1 class="text-4xl font-bold">图谱列表</h1>
                        <p class="text-base-content/65 mt-3">公共图谱接口已恢复，当前页面重新接回真实数据读取与收藏操作。</p>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button class="btn btn-outline btn-sm view-toggle active" data-view="recommended" onclick="toggleView('recommended')">推荐</button>
                        <button class="btn btn-outline btn-sm view-toggle" data-view="viewCount" onclick="toggleView('viewCount')">热门</button>
                        <button class="btn btn-outline btn-sm view-toggle" data-view="date" onclick="toggleView('date')">最新</button>
                    </div>
                </div>

                <div class="grid graph-filter-grid gap-6">
                    <div class="space-y-4">
                        <div class="join w-full relative">
                            <input id="searchInput" type="text" class="input input-bordered join-item flex-1" placeholder="搜索图谱名称或描述">
                            <button class="btn btn-primary join-item" onclick="performSearch()">搜索</button>
                            <div id="searchSuggestions" class="search-suggestions hidden"></div>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="text-sm text-base-content/60">领域筛选</span>
                            <button class="btn btn-sm btn-outline filter-btn active" data-filter="all" onclick="filterGraphs('all')">全部</button>
                            <button class="btn btn-sm btn-outline filter-btn" data-filter="science" onclick="filterGraphs('science')">科学</button>
                            <button class="btn btn-sm btn-outline filter-btn" data-filter="engineering" onclick="filterGraphs('engineering')">工程</button>
                            <button class="btn btn-sm btn-outline filter-btn" data-filter="medicine" onclick="filterGraphs('medicine')">医学</button>
                            <button class="btn btn-sm btn-outline filter-btn" data-filter="humanities" onclick="filterGraphs('humanities')">人文</button>
                            <button class="btn btn-sm btn-outline filter-btn" data-filter="economics" onclick="filterGraphs('economics')">经济</button>
                            <button class="btn btn-sm btn-outline filter-btn" data-filter="information" onclick="filterGraphs('information')">信息</button>
                            <button class="btn btn-sm btn-outline filter-btn" data-filter="education" onclick="filterGraphs('education')">教育</button>
                            <button class="btn btn-sm btn-outline filter-btn" data-filter="other" onclick="filterGraphs('other')">其他</button>
                        </div>
                    </div>

                    <aside class="bg-base-100 border border-base-300 rounded-box p-4 shadow-soft space-y-4">
                        <div>
                            <div class="text-sm font-semibold">结果</div>
                            <div id="resultCount" class="text-sm text-base-content/70 mt-1">加载中...</div>
                        </div>
                        <div>
                            <label class="label px-0"><span class="label-text text-sm">关键词过滤</span></label>
                            <input id="keywordFilter" type="text" class="input input-bordered input-sm w-full" placeholder="进一步过滤当前结果">
                        </div>
                        <button class="btn btn-ghost btn-sm w-full" onclick="resetFilters()">重置筛选</button>
                    </aside>
                </div>
            </div>
        </div>
    </section>

    <section class="container mx-auto px-4 py-10 max-w-6xl">
        <div id="graphGrid" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-6"></div>
        <div id="graphPager" class="graph-pager mt-8"></div>
    </section>

    <th:block layout:fragment="js">
        <script th:src="@{/js/graph-list.js}"></script>
    </th:block>
</div>
</body>
</html>
