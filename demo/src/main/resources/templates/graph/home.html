<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>首页</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/home.css}">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <section class="hero py-16 md:py-24 border-b border-base-300">
        <div class="container mx-auto px-4 max-w-6xl">
            <div class="grid home-hero-grid gap-10 items-center">
                <div class="space-y-6">
                    <span class="badge badge-outline badge-primary">知识图谱平台</span>
                    <h1 class="text-4xl md:text-6xl font-bold text-base-content leading-tight">
                        GraphWisdom
                    </h1>
                    <p class="text-lg text-base-content/70 max-w-2xl">
                        当前版本先恢复运行骨架。首页、登录、认证链路已接回，图谱与社区能力会逐步按计划恢复。
                    </p>
                    <div class="join w-full max-w-2xl relative">
                        <input id="searchInput" type="text" class="input input-bordered join-item flex-1 search-focus"
                               placeholder="搜索图谱、主题或关键词">
                        <button class="btn btn-primary join-item" onclick="performSearch()">搜索</button>
                        <div id="searchSuggestions" class="hidden absolute left-0 right-0 top-full mt-2 bg-base-100 border border-base-300 rounded-box shadow-soft z-20">
                            <div id="suggestionsList" class="p-2"></div>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button class="btn btn-sm btn-outline" onclick="searchTag('知识图谱')">知识图谱</button>
                        <button class="btn btn-sm btn-outline" onclick="searchTag('人工智能')">人工智能</button>
                        <button class="btn btn-sm btn-outline" onclick="searchTag('医学知识')">医学知识</button>
                    </div>
                </div>
                <div class="bg-base-100 border border-base-300 rounded-box p-6 shadow-soft">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-4 rounded-box bg-base-200">
                            <div class="text-sm text-base-content/60">当前阶段</div>
                            <div class="text-xl font-semibold mt-2">骨架恢复</div>
                        </div>
                        <div class="p-4 rounded-box bg-base-200">
                            <div class="text-sm text-base-content/60">已恢复</div>
                            <div class="text-xl font-semibold mt-2">编译与认证</div>
                        </div>
                        <div class="p-4 rounded-box bg-base-200">
                            <div class="text-sm text-base-content/60">下一步</div>
                            <div class="text-xl font-semibold mt-2">图谱接口</div>
                        </div>
                        <div class="p-4 rounded-box bg-base-200">
                            <div class="text-sm text-base-content/60">状态</div>
                            <div class="text-xl font-semibold mt-2">可继续修复</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="py-14 bg-base-100">
        <div class="container mx-auto px-4 max-w-6xl">
            <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-8">
                <div>
                    <h2 class="text-2xl font-bold">推荐图谱</h2>
                    <p id="recommendedGraphsMeta" class="text-base-content/60 mt-2">正在加载公开图谱...</p>
                </div>
                <a th:href="@{/graph/graph_list.html}" class="btn btn-outline btn-sm">查看全部</a>
            </div>
            <div id="recommendedGraphsGrid" class="grid sm:grid-cols-2 xl:grid-cols-4 gap-6">
                <div class="card bg-base-100 border border-base-300 shadow-soft">
                    <div class="card-body">
                        <h3 class="card-title">平台骨架修复中</h3>
                        <p class="text-sm text-base-content/70">当前首页已接回，图谱接口正在下一阶段恢复。</p>
                    </div>
                </div>
                <div class="card bg-base-100 border border-base-300 shadow-soft">
                    <div class="card-body">
                        <h3 class="card-title">认证链路已恢复</h3>
                        <p class="text-sm text-base-content/70">登录、注册、个人资料基础服务已补齐。</p>
                    </div>
                </div>
                <div class="card bg-base-100 border border-base-300 shadow-soft">
                    <div class="card-body">
                        <h3 class="card-title">模板骨架已恢复</h3>
                        <p class="text-sm text-base-content/70">公共头部、脚本和入口页面不再是空白模板。</p>
                    </div>
                </div>
                <div class="card bg-base-100 border border-base-300 shadow-soft">
                    <div class="card-body">
                        <h3 class="card-title">接口恢复进行中</h3>
                        <p class="text-sm text-base-content/70">GraphController 和 NodeController 是下一批修复重点。</p>
                    </div>
                </div>
            </div>
            <div id="recommendedGraphsPager" class="home-pager mt-8"></div>
        </div>
    </section>

    <th:block layout:fragment="js">
        <script th:src="@{/js/home.js}"></script>
    </th:block>
</div>
</body>
</html>
